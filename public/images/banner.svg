<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CUET Prep Arena animated banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05060F"/>
      <stop offset="1" stop-color="#0B0D1A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#E879F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="26.5" stroke="url(#accentGrad)" stroke-opacity="0.35" stroke-width="3"/>

  <circle cx="180" cy="90" r="130" fill="#6366F1" opacity="0.16">
    <animate attributeName="cy" values="90;130;90" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="330" r="150" fill="#22D3EE" opacity="0.12">
    <animate attributeName="cy" values="330;290;330" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="380" r="110" fill="#E879F9" opacity="0.10">
    <animate attributeName="cx" values="620;700;620" dur="9s" repeatCount="indefinite"/>
  </circle>

  <text x="70" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" fill="#FFFFFF">CUET PREP</text>
  <text x="70" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" fill="url(#accentGrad)">ARENA</text>
  <text x="72" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#9CA3AF">Practice • PYQ • Timer • Topic-wise Analytics</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
    <g>
      <rect x="72" y="300" width="120" height="44" rx="22" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.5"/>
      <text x="132" y="328" text-anchor="middle" fill="#A5B4FC">Practice</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="208" y="300" width="90" height="44" rx="22" fill="#E879F9" fill-opacity="0.15" stroke="#E879F9" stroke-opacity="0.5"/>
      <text x="253" y="328" text-anchor="middle" fill="#F0ABFC">PYQ</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="314" y="300" width="130" height="44" rx="22" fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="379" y="328" text-anchor="middle" fill="#67E8F9">Analytics</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g>
    <circle cx="980" cy="170" r="86" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="10" fill="none"/>
    <circle cx="980" cy="170" r="86" stroke="url(#accentGrad)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="540" stroke-dashoffset="540">
      <animate attributeName="stroke-dashoffset" values="540;120;540" dur="9s" repeatCount="indefinite"/>
    </circle>
    <text x="980" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">15:00</text>
  </g>

  <g>
    <rect x="700" y="300" width="26" height="60" rx="8" fill="url(#barGrad)">
      <animate attributeName="height" values="60;100;60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="300;260;300" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="742" y="280" width="26" height="80" rx="8" fill="url(#barGrad)">
      <animate attributeName="height" values="80;120;80" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="280;240;280" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="784" y="310" width="26" height="50" rx="8" fill="url(#barGrad)">
      <animate attributeName="height" values="50;95;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="310;265;310" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="826" y="270" width="26" height="90" rx="8" fill="url(#barGrad)">
      <animate attributeName="height" values="90;130;90" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="270;230;270" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="700" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6B7280">Accuracy • Speed • Consistency</text>
</svg>
